{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Six Degrees of Spotify</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body class="bg-dark text-light">
        <nav class="navbar navbar-expand-lg navbar-dark bg-black">
            <div class="container">
                <a class="navbar-brand text-success fw-bold" href="#">Six Degrees of Spotify</a>
            </div>
        </nav>

        <div class="container mt-5 text-center">
            <h1 class="display-4 fw-bold">Six Degrees of Spotify</h1>
            <p class="lead">Esses artistas estão conectados de alguma forma?</p>
            <p class="lead">Vamos descobrir!</p>
            <form class="justify-content-center mt-4">
                <div class="row">
                    <div class="col md-4">
                        <label class="form-label">Artista 1</label>
                        <input type="text" class="form-control" id="artist1" placeholder="ex. Anitta">
                    </div>
                    <div class="col md-4">
                        <label class="form-label">Artista 2</label>
                        <input type="text" class="form-control" id="artist2" placeholder="ex. Nirvana">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4">Descobrir Conexão</button>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
